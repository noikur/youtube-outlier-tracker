<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Outlier Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #111827;
      background: #ffffff;
    }
    .header {
      padding: 14px 16px 12px;
      border-bottom: 0.5px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111827;
    }
    .logo {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: #1f2937;
      border: 0.5px solid #374151;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .header-text { flex: 1; }
    .title { font-size: 13px; font-weight: 500; color: #ffffff; }
    .subtitle { font-size: 11px; color: #6b7280; margin-top: 1px; }
    .status-pill {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 500;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-online { background: #f0fdf4; color: #16a34a; }
    .status-online .status-dot { background: #22c55e; }
    .status-offline { background: #fef2f2; color: #dc2626; }
    .status-offline .status-dot { background: #ef4444; }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr;
      border-bottom: 0.5px solid #e5e7eb;
    }
    .stat {
      padding: 14px 16px;
    }
    .stat:first-child { border-right: 0.5px solid #e5e7eb; }
    .stat-num { font-size: 22px; font-weight: 500; }
    .stat-label { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .section {
      padding: 12px 16px;
      border-bottom: 0.5px solid #e5e7eb;
    }
    .section-title {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.07em; color: #9ca3af;
      font-weight: 500; margin-bottom: 8px;
    }
    .legend-row {
      display: flex; align-items: center;
      gap: 8px; margin-bottom: 6px;
    }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-pill {
      display: flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 500;
      background: rgba(17,24,39,0.08);
      color: #111827; min-width: 52px;
    }
    .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .dot-fire { background: #ef4444; }
    .dot-spark { background: #f59e0b; }
    .dot-low { background: #3b82f6; }
    .legend-text { font-size: 12px; color: #6b7280; }
    .footer {
      padding: 10px 16px;
      display: flex; align-items: center;
      justify-content: space-between;
    }
    .footer-text { font-size: 11px; color: #9ca3af; }
    .footer-link {
      font-size: 11px; color: #2563eb;
      text-decoration: none;
      display: flex; align-items: center; gap: 3px;
    }
    .offline-msg {
      padding: 10px 16px;
      font-size: 11px; color: #6b7280;
      line-height: 1.5;
      border-top: 0.5px solid #e5e7eb;
    }
    .offline-msg code {
      background: #f3f4f6; padding: 1px 4px;
      border-radius: 3px; font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📊</div>
    <div class="header-text">
      <div class="title">Outlier Tracker</div>
      <div class="subtitle">YouTube performance intel</div>
    </div>
    <div class="status-pill" id="status-pill">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Checking...</span>
    </div>
  </div>

  <div class="stats" id="stats" style="display:none">
    <div class="stat">
      <div class="stat-num" id="stat-channels">—</div>
      <div class="stat-label">Channels tracked</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-outliers">—</div>
      <div class="stat-label">Outliers logged</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Badge guide</div>
    <div class="legend-row">
      <div class="legend-pill"><div class="dot dot-fire"></div>10x+</div>
      <div class="legend-text">Major outlier — rare, high signal</div>
    </div>
    <div class="legend-row">
      <div class="legend-pill"><div class="dot dot-spark"></div>3–10x</div>
      <div class="legend-text">Solid breakout</div>
    </div>
    <div class="legend-row">
      <div class="legend-pill"><div class="dot dot-low"></div>2–3x</div>
      <div class="legend-text">Above channel average</div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-text" id="last-scan">—</div>
    <a class="footer-link" href="#" id="dash-link">
      Dashboard ↗
    </a>
  </div>

  <div class="offline-msg" id="offline-msg" style="display:none">
    Backend not running. Start it with:<br>
    <code>python run_api.py</code>
  </div>

  <script src="popup.js"></script>
</body>
</html>
